      <stop offset="1" stop-color="#2743b8"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tileS)"/>
  <path d="M64 18 H156 L210 72 V200 A22 22 0 0 1 188 222 H64 A22 22 0 0 1 42 200 V40 A22 22 0 0 1 64 18 Z" fill="#ffffff"/>
  <path d="M156 18 L210 72 H172 A16 16 0 0 1 156 56 Z" fill="#bdd0ff"/>
